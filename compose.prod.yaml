# Produkcja (szkic). Użycie: docker compose -f compose.prod.yaml up -d
# Obrazy budowane z targetów `prod`, bez bind-mountów źródeł, z restartami i TLS.
# Sekrety wyłącznie z .env (poza repo). Storage mediów: S3-kompatybilny.
name: jnk-studio-prod

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

  web:
    image: ghcr.io/jnk-studio/web:${TAG:-latest}
    build:
      context: ./apps/web
      target: prod
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:3000/api/v1
      API_TOKEN: ${API_TOKEN}
      ORIGIN: https://${APP_HOST}
      PORT: 3000
    depends_on:
      - backend

  backend: &rails
    image: ghcr.io/jnk-studio/cms:${TAG:-latest}
    build:
      context: ./apps/cms
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      API_TOKEN: ${API_TOKEN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-auto}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  jobs:
    <<: *rails
    command: bin/jobs
    healthcheck:
      disable: true

volumes:
  caddy_data: {}
  caddy_config: {}
