name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Kompilacja Paraglide (komunikaty)
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Lint (ESLint + Prettier)
        run: pnpm lint
      - name: Typy (svelte-check)
        run: pnpm check
      - name: Testy jednostkowe (Vitest)
        run: pnpm test:unit -- --run
      - name: Build
        run: pnpm build

  cms:
    name: Backend (apps/cms)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jnk
          POSTGRES_PASSWORD: jnk
          POSTGRES_DB: jnk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jnk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://jnk:jnk@localhost:5432/jnk_test
    steps:
      - uses: actions/checkout@v4
      - name: Biblioteki systemowe (pg, vips)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libvips
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/cms
          bundler-cache: true
      - name: Przygotuj bazę testową
        run: bin/rails db:prepare
      - name: RuboCop
        run: bin/rubocop --no-server
      - name: Brakeman (bezpieczeństwo)
        run: bin/brakeman --no-pager -q
      - name: bundler-audit
        run: bundle exec bundler-audit check --update
      - name: Testy (Minitest)
        run: bin/rails test

  images:
    name: Build obrazów Docker
    runs-on: ubuntu-latest
    needs: [web, cms]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web (target prod)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: prod
          push: false
      - name: Build cms (target prod)
        uses: docker/build-push-action@v6
        with:
          context: apps/cms
          target: prod
          push: false

  # TODO (etap „Strona publiczna"): e2e Playwright (PL/EN + formularz) na docker compose
  # oraz Lighthouse CI z budżetem ≥ 90 (mobile). Dodamy, gdy trasy publiczne będą kompletne.
